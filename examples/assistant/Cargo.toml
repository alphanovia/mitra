[package]
name = "assistant"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "assistant-server"
path = "src/bin/server.rs"

[[bin]]
name = "assistant-cli"
path = "src/bin/cli.rs"

[dependencies]
# The test crate: rows and givens are printed for `mitra explain`, from
# unit tests and from the challenger's tests in tests/ alike.
mitra = { path = "../../crates/mitra" }

# Not part of Mitra's own build: an example project of its own.
[workspace]
