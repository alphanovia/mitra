[workspace]
resolver = "2"
members = [
    "crates/mitra-lang",
    "crates/mitra-store",
    "crates/mitra-rust",
    "crates/mitra-cli",
    "crates/mitra",
    "crates/mitra-derive",
]
# Each example is a project of its own.
exclude = ["examples"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
